<figure style="margin:28px 0 0">
<div style="border:var(--border);background:var(--paper);padding:28px 26px 22px;position:relative">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;color:var(--grey-2)">THE MARKET, SIZED</span>
<span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;color:var(--red)">VENTURE SCALE</span>
</div>
<div style="border-top:2.5px dashed var(--red);margin:10px 0 0"></div>
<div style="display:flex;align-items:flex-end;gap:14px;height:250px;margin-top:14px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:218px;background:#C9C4BB;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:190px;background:#C9C4BB;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:172px;background:#C9C4BB;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:150px;background:#C9C4BB;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:129px;background:#C9C4BB;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:98px;background:#1E7A72;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:80px;background:#1E7A72;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:66px;background:#1E7A72;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:55px;background:#1E7A72;border:2px solid var(--ink)"></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:46px;background:#1E7A72;border:2px solid var(--ink)"></div></div></div>
<div style="display:flex;gap:22px;margin:14px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--grey-3)">
<span style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;background:#C9C4BB;border:2px solid var(--ink);display:block"></span>consolidating, building in-house</span>
<span style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;background:#1E7A72;border:2px solid var(--ink);display:block"></span>right-sized customers left over</span>
</div>
<p style="margin:14px 0 0;font-size:13.5px;line-height:1.55;color:var(--grey-3);max-width:56ch">The bigger players were building in-house. What remained was real, but not venture scale.</p>
</div>
<figcaption style="margin-top:12px;font-family:var(--font-mono);font-size:11.5px;color:var(--grey-2)">The ceiling.</figcaption>
</figure>
