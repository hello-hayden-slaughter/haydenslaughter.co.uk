<figure style="margin:28px 0 0">
<div style="display:flex;gap:24px">
<div style="flex:1;border:var(--border);box-shadow:var(--shadow-hard);background:var(--paper)">
<div style="padding:12px 18px;background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em">DOUBLE DOWN</div>
<div style="padding:20px 18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px;border:var(--border);background:var(--mint);padding:13px 16px"><span style="font-family:var(--font-display);font-weight:700;font-size:16px">Customer A</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:11px">paying &middot; growing</span></div><div style="display:flex;align-items:center;gap:10px;border:var(--border);background:var(--mint);padding:13px 16px"><span style="font-family:var(--font-display);font-weight:700;font-size:16px">Customer B</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:11px">paying &middot; growing</span></div>
<p style="margin:4px 0 0;font-size:13.5px;line-height:1.55;color:var(--grey-3)">Two paying customers, both growing. All build effort pointed here.</p>
</div>
</div>
<div style="flex:1;border:var(--border);box-shadow:var(--shadow-hard);background:var(--paper)">
<div style="padding:12px 18px;border-bottom:var(--border);font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;color:var(--grey-3)">CLOSE OUT PROPERLY</div>
<div style="padding:20px 18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px;border:var(--border-thin);padding:10px 16px;color:var(--grey-3)"><span style="font-family:var(--font-display);font-weight:600;font-size:14px">Pilot 1</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--teal)">&#10003; finished</span></div><div style="display:flex;align-items:center;gap:10px;border:var(--border-thin);padding:10px 16px;color:var(--grey-3)"><span style="font-family:var(--font-display);font-weight:600;font-size:14px">Pilot 2</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--teal)">&#10003; finished</span></div><div style="display:flex;align-items:center;gap:10px;border:var(--border-thin);padding:10px 16px;color:var(--grey-3)"><span style="font-family:var(--font-display);font-weight:600;font-size:14px">Pilot 3</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--teal)">&#10003; finished</span></div>
<p style="margin:4px 0 0;font-size:13.5px;line-height:1.55;color:var(--grey-3)">Three pilots wound down cleanly. Reputation intact.</p>
</div>
</div>
</div>
<figcaption style="margin-top:14px;font-family:var(--font-mono);font-size:11.5px;color:var(--grey-2)">The two-against-three split.</figcaption>
</figure>
