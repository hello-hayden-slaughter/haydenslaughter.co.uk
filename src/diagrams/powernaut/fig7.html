<figure style="margin:28px 0 0">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px">
<div style="background:var(--paper);border:var(--border);box-shadow:var(--shadow-hard);padding:18px 18px 16px;display:flex;flex-direction:column;gap:11px">
<div style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;color:var(--teal)">HEALTH</div>

<div style="display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted var(--grey-1);padding-bottom:7px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--teal);flex:none">09:41</span><span style="font-family:var(--font-body);font-size:11.5px;color:var(--grey-3)">Dispatch adjusted &middot; Site 12</span></div><div style="display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted var(--grey-1);padding-bottom:7px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--teal);flex:none">09:12</span><span style="font-family:var(--font-body);font-size:11.5px;color:var(--grey-3)">Nomination submitted</span></div><div style="display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted var(--grey-1);padding-bottom:7px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--teal);flex:none">08:56</span><span style="font-family:var(--font-body);font-size:11.5px;color:var(--grey-3)">Steering signal received</span></div><div style="display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted var(--grey-1);padding-bottom:7px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--teal);flex:none">08:30</span><span style="font-family:var(--font-body);font-size:11.5px;color:var(--grey-3)">Day-ahead schedule set</span></div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--grey-2)">Answers without a ticket.</div>
</div>
<div style="background:var(--paper);border:var(--border);box-shadow:var(--shadow-hard);padding:18px 18px 16px;display:flex;flex-direction:column;gap:11px">
<div style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;color:var(--teal)">VALUE</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.02em">Created</div>
<div style="display:flex;align-items:flex-end;gap:12px;height:82px;margin-top:2px">
<div style="width:38px;height:50px;background:var(--grey-1);border:2px solid var(--ink)"></div>
<div style="width:38px;height:82px;background:var(--mint);border:2px solid var(--ink)"></div>
<div style="font-family:var(--font-body);font-size:11px;line-height:1.4;color:var(--grey-3);padding-bottom:2px">forecast vs<br>realised savings</div>
</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--grey-2)">Something real at renewal.</div>
</div>
</div>
<figcaption style="margin-top:14px;font-family:var(--font-mono);font-size:11.5px;color:var(--grey-2)">The three insight layers.</figcaption>
</figure>
